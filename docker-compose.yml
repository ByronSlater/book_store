services:
  db:
    image: postgres:17
    container_name: book_store_db
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_DB: book_store
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - book_store_network

  app:
    image: book_store
    container_name: book_store_app
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5001:5001"
    environment:
      FLASK_DATABASE_URI: postgresql://postgres:password@db/book_store
    networks:
      - book_store_network

networks:
  book_store_network:
    driver: bridge
