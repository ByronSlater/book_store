{% extends "base.html" %}

{% block body %}
<div class="max-w-5xl py-12 mx-auto">
  <h1 class="text-3xl mb-8 max-w-[60lvw] text-center mx-auto">Welcome to <span class="font-[Playfair_Display] italic">Chapter and Verse</span> where we hope you leave with a story you'll love.</h1>

  <div class="carousel rounded-box w-full h-[70lvh] bg-white">
    <div class="carousel-item w-full h-full relative overflow-hidden">
      <img src="{{url_for('static', filename='assets/books.png')}}" class="scale-110 object-cover blur-[3px] inset-0 absolute">

      <div class="z-1 flex flex-col mt-auto mb-8 ml-8 glass rounded-box p-4">
        <h3 class="text-6xl mb-1 font-[Playfair_Display]">Browse our books</h3>
        <p class="text-xl italic">Whatever you're looking for, you'll find it here.</p>
      </div>
    </div>
    <div class="carousel-item w-full h-full bg-gray-500"></div>
    <div class="carousel-item w-full h-full bg-amber-500"></div>
    <div class="carousel-item w-full h-full bg-blood-red-500"></div>
  </div>
</div>
{% endblock %}
